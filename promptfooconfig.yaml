# Week 1 starter. Grows into the full matrix as the golden set grows.
description: RAG assistant over device documentation

prompts:
  - file://prompts/assistant.txt

# Model IDs are PINNED to dated versions where the provider offers one. A
# floating alias means the provider can change the system under test without
# a commit in this repo -- which is a regression you would hear about from a
# user rather than from CI.
providers:
  - id: anthropic:messages:claude-haiku-4-5-20251001
    config:
      temperature: 0

  # PARKED (finding 003): claude-sonnet-5 cannot be called through this
  # provider at all. promptfoo's Anthropic provider ALWAYS sends
  # `temperature`, defaulting to 0 when unset (messages.js:85-87), and
  # Sonnet 5 rejects the parameter with a 400. Removing it from this config
  # therefore changes nothing -- the default is injected downstream.
  # A `thinking` config would skip that branch and omit the parameter, but
  # extended thinking is a different system under test, so it is not a
  # neutral workaround. Re-enable once patched or fixed upstream.
  # - id: anthropic:messages:claude-sonnet-5

  # Add a second vendor once a key exists; cross-vendor disagreement is one
  # of the cheapest signals that a prompt is underspecified.
  # - id: openai:gpt-5-mini

defaultTest:
  options:
    # The judge is pinned separately from the models under test, so a change
    # in judge behaviour can never be mistaken for a change in quality.
    provider: anthropic:messages:claude-haiku-4-5-20251001
  assert:
    - type: latency
      threshold: 8000
    # NOTE (finding 002): the built-in `cost` assertion is NOT usable here.
    # promptfoo 0.118.17's Anthropic price table stops at Claude 4.x, so cost
    # is undefined for both models under test, and a per-provider `cost:`
    # override cannot rescue it -- calculateCost() returns early when the
    # model id is absent from the table, before it ever reads config.cost.
    # Replaced by our own token-based cost gate in week 1. See docs/method.md.

tests: file://fixtures/cases.yaml
