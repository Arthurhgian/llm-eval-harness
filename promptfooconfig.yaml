# Week 1 starter. Grows into the full matrix as the golden set grows.
description: RAG assistant over device documentation

prompts:
  - file://prompts/assistant.txt

providers:
  - id: anthropic:messages:claude-haiku-4-5
    config:
      temperature: 0
  - id: openai:gpt-5-mini
    config:
      temperature: 0

defaultTest:
  options:
    # Judge model is pinned separately from the models under test, on purpose.
    provider: anthropic:messages:claude-haiku-4-5
  assert:
    - type: latency
      threshold: 8000
    - type: cost
      threshold: 0.01

tests: file://fixtures/cases.yaml
